# 도구 설정 전용. 앱 의존성은 requirements.txt, 개발 도구는 requirements-dev.txt.

[tool.ruff]
# gaindb/ 는 상류 무수정 벤더링(LGPL) — 검사하지 않는다 (D015)
extend-exclude = ["gaindb", "docs", "venv"]

[tool.ruff.lint]
# ruff 0.17 의 넓어진 기본 규칙 대신 기존 기본(E4·E7·E9·F)을 고정 — 앱 코드 정리는 별도 계획
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
