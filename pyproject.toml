# 도구 설정 전용. 앱 의존성은 requirements.txt, 개발 도구는 requirements-dev.txt.

[tool.ruff]
# gaindb/ 는 상류 무수정 벤더링(LGPL) — 검사하지 않는다 (D015)
extend-exclude = ["gaindb", "docs", "venv"]

[tool.ruff.lint]
# ruff 0.17 기본 규칙. 워커의 예외→error 시그널 경계와 정리 단계의 실패 삼킴은 의도된 코드 (D037)
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
